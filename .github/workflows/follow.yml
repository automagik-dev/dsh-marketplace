name: Follow releases

# Every 30 minutes (or when dispatched): each product in products.json that cut a newer
# release, whose own plugins carry that release's version, gets them listed at it. The
# result is checked like any change, then committed to main.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: follow
  cancel-in-progress: false

jobs:
  follow:
    name: Follow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      DO_NOT_TRACK: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Follow the products' releases
        run: |
          set -euo pipefail
          bun scripts/market.ts follow | tee "${RUNNER_TEMP}/follow.log"

      - name: Check and commit
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json products.json; then
            echo "Nothing new"
            exit 0
          fi
          bun scripts/market.ts check
          release=$(node -p "require('./products.json').products.map(p => p.id + ' ' + p.release.version).join(', ')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dropped=$(sed -n 's/^market: dropped: //p' "${RUNNER_TEMP}/follow.log")
          if [[ -n "${dropped}" ]]; then
            count=$(awk -F', ' '{ print NF }' <<< "${dropped}")
            git commit -qa -m "chore(index): list ${release}; drop ${count} plugins" -m "Dropped, no longer listed by their product: ${dropped}"
          else
            git commit -qam "chore(index): list ${release}"
          fi
          git push -q origin HEAD:main
